<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Démo messagerie</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <section id="chat" class="chat" hidden>
          <header class="chat-header">
            <div class="avatar" id="avatar"></div>
            <div class="who">
              <strong id="account"></strong>
              <span>Actif maintenant</span>
            </div>
            <div class="header-actions">
              <button class="icon-btn" aria-label="Appel" tabindex="-1">
                <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
              </button>
              <button class="icon-btn" aria-label="Vidéo" tabindex="-1">
                <svg viewBox="0 0 24 24"><path d="M15 8.5V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1.5l5 3.5V5z"/></svg>
              </button>
              <button class="reset" id="reset" title="Recommencer la conversation">Réinitialiser</button>
            </div>
          </header>

          <div class="messages" id="messages" aria-live="polite"></div>

          <form class="composer" id="form" autocomplete="off">
            <div class="input-wrap">
              <textarea id="input" rows="1" placeholder="Message..." aria-label="Message"></textarea>
              <span class="input-icons">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 3 3 3-3 5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              </span>
            </div>
            <button type="submit" class="send" id="send" aria-label="Envoyer" disabled>Envoyer</button>
          </form>
        </section>

        <section id="notfound" class="notfound" hidden>
          <p>Démo introuvable</p>
        </section>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
