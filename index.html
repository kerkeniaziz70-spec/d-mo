<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Démo messagerie</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <section id="chat" class="chat">
          <div class="statusbar" aria-hidden="true">
            <span class="clock" id="clock">23:45</span>
            <span class="sys">
              <svg class="sig" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
              <svg class="wifi" viewBox="0 0 18 13"><path d="M9 12.2 6.6 9.5a3.4 3.4 0 0 1 4.8 0zM3.6 6.9a7.6 7.6 0 0 1 10.8 0l-1.4 1.5a5.6 5.6 0 0 0-8 0zM.9 4A11.4 11.4 0 0 1 17.1 4l-1.4 1.5a9.4 9.4 0 0 0-13.4 0z"/></svg>
              <svg class="batt" viewBox="0 0 27 13"><rect x=".6" y=".6" width="22.8" height="11.8" rx="3.6" fill="none" stroke="currentColor" opacity=".45"/><rect x="2.2" y="2.2" width="19.6" height="8.6" rx="2.4"/><path d="M25 4.5v4c.9-.3 1.6-1.1 1.6-2s-.7-1.7-1.6-2z" opacity=".5"/></svg>
            </span>
          </div>
          <header class="chat-header">
            <span class="back" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <div class="avatar" id="avatar"></div>
            <div class="who">
              <strong><span id="account"></span><svg class="verified" id="verified" viewBox="0 0 24 24"><path d="M12 1.8l2.4 1.7 2.9-.2 1.2 2.7 2.6 1.3-.4 2.9L22 12l-1.3 2.1.4 2.9-2.6 1.3-1.2 2.7-2.9-.2L12 22.2l-2.4-1.7-2.9.2-1.2-2.7-2.6-1.3.4-2.9L2 12l1.3-2.1-.4-2.9 2.6-1.3 1.2-2.7 2.9.2z"/><path d="m8 12.2 2.8 2.8L16.2 9.6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></strong>
              <span id="subname"></span>
            </div>
            <div class="header-actions">
              <button class="icon-btn" aria-label="Appel" tabindex="-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M6.6 3.2h2.6l1.5 4-2 1.4a11 11 0 0 0 5.7 5.7l1.4-2 4 1.5v2.6a2 2 0 0 1-2.2 2A15.8 15.8 0 0 1 4.6 5.4a2 2 0 0 1 2-2.2z"/></svg>
              </button>
              <button class="icon-btn" aria-label="Vidéo" tabindex="-1">
                <svg viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="2" y="5" width="15" height="14" rx="3.5"/><path d="m17 10.5 6.2-3.6a.6.6 0 0 1 .9.5v9.2a.6.6 0 0 1-.9.5L17 13.5"/></svg>
              </button>
              <button class="reset" id="reset" title="Recommencer la conversation">Réinitialiser</button>
            </div>
          </header>

          <div class="messages" id="messages" aria-live="polite"></div>

          <form class="composer" id="form" autocomplete="off">
            <div class="input-wrap">
              <span class="cam" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 4 7.6 6H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2.6L15 4zm3 4.5a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 1.8a2.2 2.2 0 1 0 0 4.4 2.2 2.2 0 0 0 0-4.4z"/></svg></span>
              <textarea id="input" rows="1" placeholder="Votre message..." aria-label="Message"></textarea>
              <span class="input-icons">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 3 3 3-3 5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              </span>
              <button type="submit" class="send" id="send" aria-label="Envoyer" disabled><svg viewBox="0 0 24 24"><path d="M21.4 3.1a1 1 0 0 1 .5 1.2l-5.2 15.6a1.2 1.2 0 0 1-2.1.3l-3-4.3-4.6-1.9a1.2 1.2 0 0 1 0-2.2L20 2.8a1 1 0 0 1 1.4.3zM11.9 14.3l2.3 3.3 3.5-10.5-7 5.8z"/></svg></button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <button class="gear" id="gear" aria-label="Réglages" title="Réglages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <aside class="panel" id="panel" hidden>
    <h2>Demo Settings</h2>
    <label>Clé API Anthropic<input id="s-key" type="password" autocomplete="off" placeholder="sk-ant-..."></label>
    <small>Stockée uniquement dans ce navigateur.</small>
    <label>Modèle
      <select id="s-model">
        <option value="claude-haiku-5-5">Claude Haiku 5.5 (rapide)</option>
        <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
        <option value="claude-opus-5-5">Claude Opus 5.5</option>
      </select>
    </label>
    <label>Pseudo (grand texte en en-tête)<input id="s-handle"></label>
    <label>Nom (petit texte dessous)<input id="s-subname"></label>
    <label>Photo de profil<input id="s-photo" type="file" accept="image/*"></label>
    <label class="check"><input id="s-verified" type="checkbox"> Badge vérifié</label>
    <label>Heure du téléphone (HH:MM ou « auto »)<input id="s-clock"></label>
    <label>Entreprise<input id="s-company"></label>
    <label>Message d'accueil<textarea id="s-welcome" rows="2"></textarea></label>
    <label>Instructions de l'agent<textarea id="s-instr" rows="6"></textarea></label>
    <label>Base de connaissances<textarea id="s-base" rows="10"></textarea></label>
    <button class="apply" id="s-apply">Appliquer et recommencer</button>
  </aside>

  <script src="app.js"></script>
</body>
</html>
